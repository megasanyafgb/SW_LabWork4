name: SQL Linter
on:
 push:
  branches: LW4
jobs:
 SQLLinter:
  runs-on: ubuntu-latest
  steps:
  - name: Checkout Code in Repository
    uses: "actions/checkout@v3"
  - name: Start SQL Linter
    run: |
      pip install sqlfluff
      sqlfluff lint $GITHUB_WORKSPACE/2-SoftwareDesign/2.4-DetailedDataSchema/RelationDB_DetailedDataSchema.sql --dialect ansi